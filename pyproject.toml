[project]
name = "autofinetune"
version = "0.1.0"
description = "Autonomous LoRA fine-tuning workbench inspired by autoresearch"
requires-python = ">=3.10"
dependencies = [
    "unsloth",
    "trl>=0.17.0",
    "transformers>=4.51.0",
    "datasets>=3.0.0",
    "peft>=0.15.0",
    "bitsandbytes>=0.45.0",
    "pyarrow>=21.0.0",
    "pandas>=2.3.0",
    "torch",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
